<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>森の迷路</title></head>
<body>
<main id="app" class="game-shell">
  <header class="hud"><div id="stars">⭐ 0 / 1</div><div id="stage">ステージ 1</div></header>
  <section class="play-area"><div id="game-container" class="maze-frame" aria-label="森の迷路"></div><div class="control-panel"><div class="dpad" aria-label="移動ボタン"><button class="direction up" data-direction="up" aria-label="うえ">▲</button><button class="direction left" data-direction="left" aria-label="ひだり">◀</button><div class="dpad-center" aria-hidden="true">●</div><button class="direction right" data-direction="right" aria-label="みぎ">▶</button><button class="direction down" data-direction="down" aria-label="した">▼</button></div><button id="reset" class="reset" type="button">🔄 やりなおす</button><button id="stage-select" class="stage-select" type="button">ステージをえらぶ</button><button id="parent" class="parent" type="button" aria-label="保護者メニュー">⚙️</button></div></section>
  <section id="overlay" class="overlay" hidden><div class="overlay-card"><div id="overlay-title" class="overlay-title">🎉 やったー！ ✨</div><button id="next" class="next" type="button">つぎへ</button></div></section>
  <section id="save-picker" class="overlay save-picker"><div class="save-card"><div class="overlay-title save-title">どのデータであそぶ？</div><p>じぶんのデータをえらんでね</p><div id="save-slots" class="save-slots"></div><div id="save-name-form" class="save-name-form" hidden><label for="save-name">データのなまえ</label><input id="save-name" type="text" maxlength="24" autocomplete="off" placeholder="なまえをいれてね"><div><button id="save-name-ok" class="next" type="button">これであそぶ</button><button id="save-name-cancel" class="save-cancel" type="button">もどる</button></div></div></div></section>
  <section id="stage-picker" class="overlay" hidden><div class="stage-card"><div class="overlay-title stage-picker-title">ステージをえらぶ</div><p>クリアしたステージからえらべるよ</p><div id="stage-list" class="stage-list"></div><button id="close-stage-picker" class="save-cancel" type="button">もどる</button></div></section>
  <section id="parent-panel" class="overlay" hidden><div class="parent-card"><button id="close-parent" class="close-parent" type="button">×</button><h2>ほごしゃメニュー</h2><p id="auth-status">この端末に保存しています。</p><label>メールアドレス<input id="email" type="email" autocomplete="email"></label><label>パスワード<input id="password" type="password" autocomplete="current-password" minlength="6"></label><button id="sign-in" type="button">ログイン</button><button id="sign-up" type="button">新しく登録</button><p class="small-note">Firebaseを設定すると、別の端末でもセーブデータを同期できます。</p></div></section>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
