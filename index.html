<!doctype html><html lang="ja"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="theme-color" content="#eaf6d8"/><title>もりのめいろ</title></head><body>
<main id="app" class="game-shell"><header class="hud"><div id="stars">⭐ 0 / 1</div><div id="stage">ステージ 1</div></header><section class="play-area"><div id="game-container" class="maze-frame" aria-label="森の迷路"></div><div class="control-panel"><div class="dpad" aria-label="移動ボタン"><button class="direction up" data-direction="up" aria-label="うえ">▲</button><button class="direction left" data-direction="left" aria-label="ひだり">◀</button><div class="dpad-center" aria-hidden="true">●</div><button class="direction right" data-direction="right" aria-label="みぎ">▶</button><button class="direction down" data-direction="down" aria-label="した">▼</button></div><button id="reset" class="reset" type="button">🔄 やりなおす</button><button id="parent" class="parent" type="button" aria-label="保護者メニュー">⚙️</button></div></section><section id="overlay" class="overlay" hidden><div class="overlay-card"><div id="overlay-title" class="overlay-title">🎉 やったー！ ✨</div><button id="next" class="next" type="button">つぎへ</button></div></section><section id="parent-panel" class="overlay" hidden><div class="parent-card"><button id="close-parent" class="close-parent" type="button">×</button><h2>ほごしゃメニュー</h2><p id="auth-status">この端末に保存しています。</p><label>メールアドレス<input id="email" type="email" autocomplete="email"></label><button id="send-code" type="button">コードをおくる</button><label id="otp-label" hidden>6けたコード<input id="otp" inputmode="numeric" maxlength="6"></label><button id="verify-code" type="button" hidden>確認する</button><p class="small-note">ログインすると、別の端末でも続きから遊べます。</p></div></section></main><script type="module" src="/src/main.ts"></script></body></html>
